<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>CAD 检查结果</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>CAD 检查结果</h1>
    <div id="selection-info" class="muted">未选择对象</div>
  </header>
  <main>
    <!--
      V1.6 UI-CN-SIMPLIFICATION (per dispatch
      V16-UI-CN-SIMPLIFICATION-2026-09-01): the default visible
      structure is materially simpler than V1.5.
        Default visible:
          A. Header (CAD 检查结果 + selection line)
          B. #summary (compact scalar + per-issue-type counters)
          C. #groups (canonical issue groups; OPEN only on defaultOpen)
          D. 处理工作区 (Working Mode card + ONE primary CTA + collapsed 更多操作)
          E. 平面校正 (Planar Normalization card, condensed Chinese rows)
        Collapsed by default:
          - 检查详情 (was: scalar + per-issue-type details)
          - 按图层查看问题
          - 图层信息
          - 面信息
          - 技术详情 (preserves source snapshot id / fingerprint /
            config digest / raw workspace state / per-action audit /
            raw normalization audit / reason / failure_reason)
      The default screen therefore shows only what a normal user
      needs to (a) know whether their CAD has issues, (b) know the
      current workspace state, (c) know the system's recommended next
      step, and (d) click the right button.
    -->
    <section id="summary"></section>
    <section id="groups"></section>
    <!--
      V1.4 (per directive 030, Stage 4): the "处理工作区" section sits
      AFTER the per-issue-type groups block. The action row carries
      ONE primary action button (Prepare / Analyze Planarity / Apply
      Safe Normalization) and a collapsed "更多操作" <details> block
      with the secondary Discard / Rebuild controls.
    -->
    <details id="working-mode-section">
      <summary id="working-mode-summary">处理工作区</summary>
      <div id="working-mode-list"></div>
      <div id="working-mode-actions"></div>
    </details>
    <!--
      V1.6 UI-CN-SIMPLIFICATION (per dispatch §5.5): the
      "技术详情" section preserves the full data contract
      (source snapshot id, source fingerprint, execution
      config digest, raw workspace state, per-action
      action_id / rule_id / survivor_id / source occurrence
      count, raw normalization reason / audit fields). It is
      rendered CLOSED by default; normal users do not need to
      open it.
    -->
    <details id="technical-details-section">
      <summary id="technical-details-summary">技术详情</summary>
      <div id="technical-details-list"></div>
    </details>
    <!--
      V1.6 UI-CN-SIMPLIFICATION: per dispatch §3, the following
      sections remain available but are COLLAPSED by default
      and moved BELOW the primary Working Mode + Technical
      Details blocks. Users only open them when they need
      detailed per-layer / per-face inspection.
    -->
    <details id="layer-issues-section">
      <summary id="layer-issues-summary">按图层查看问题</summary>
      <div id="layer-issues-list"></div>
    </details>
    <details id="layers-section">
      <summary id="layers-summary">图层信息</summary>
      <div id="layers-list"></div>
    </details>
    <details id="face-inventory-section">
      <summary id="face-inventory-summary">面信息</summary>
      <div id="face-inventory-list"></div>
    </details>
  </main>
  <div id="toast" class="toast" hidden></div>
  <script src="app.js"></script>
</body>
</html>
